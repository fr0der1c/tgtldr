name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed images
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" || "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"
          if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$before" "${GITHUB_SHA}")"
          app=false
          web=false

          if grep -Eq '^(app/.*|deploy/docker/app\.Dockerfile|docker-compose(\.dev)?\.yml|\.dockerignore|\.github/workflows/docker-images\.yml)$' <<< "$changed_files"; then
            app=true
          fi

          if grep -Eq '^(web/.*|deploy/docker/web\.Dockerfile|docker-compose(\.dev)?\.yml|\.dockerignore|\.github/workflows/docker-images\.yml)$' <<< "$changed_files"; then
            web=true
          fi

          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"

  docker-app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: ${{ github.workflow }}-app-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: fr0der1c/tgtldr-app
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push image
        id: build
        continue-on-error: true
        timeout-minutes: 20
        uses: docker/build-push-action@v6
        with: &app-build-inputs
          context: .
          file: deploy/docker/app.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=tgtldr-app
            type=registry,ref=fr0der1c/tgtldr-app:buildcache
          cache-to: |
            type=gha,mode=max,scope=tgtldr-app
            type=registry,ref=fr0der1c/tgtldr-app:buildcache,mode=max

      - &network-retry
        name: Check for transient network failure
        id: network_retry
        if: ${{ !cancelled() && steps.build.outcome == 'failure' }}
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/build-failure.log"
          # 当前 job 只有一次构建；读取失败时保留失败状态，不盲目重试。
          docker buildx history logs --progress plain > "$log" 2>&1
          if grep -Eiq 'ERESOLVE|EINTEGRITY|E401|E403|E404|ENOTFOUND|CERT_HAS_EXPIRED|SELF_SIGNED_CERT|certificate verify failed|unauthorized|denied:|Type error:|error TS[0-9]+|Failed to compile|syntax error' "$log"; then
            echo "::error::Build failed with a non-retryable error."
            exit 1
          fi
          if ! grep -Eiq 'ECONNRESET|ETIMEDOUT|EAI_AGAIN|connection reset by peer|TLS handshake timeout|i/o timeout|temporary failure in name resolution|unexpected status.*(502|503|504)|response status.*(502|503|504)|npm (error|ERR!) code E(502|503|504)' "$log"; then
            echo "::error::Build failed without a recognized transient network error."
            exit 1
          fi
          echo "::warning::Transient network failure; retrying the build once in 30 seconds."
          sleep 30
          echo "retry=true" >> "$GITHUB_OUTPUT"

      - name: Retry build and push image
        if: ${{ !cancelled() && steps.network_retry.outputs.retry == 'true' }}
        timeout-minutes: 20
        uses: docker/build-push-action@v6
        with: *app-build-inputs

  docker-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: ${{ github.workflow }}-web-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: fr0der1c/tgtldr-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push image
        id: build
        continue-on-error: true
        timeout-minutes: 20
        uses: docker/build-push-action@v6
        with: &web-build-inputs
          context: .
          file: deploy/docker/web.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=tgtldr-web
            type=registry,ref=fr0der1c/tgtldr-web:buildcache
          cache-to: |
            type=gha,mode=max,scope=tgtldr-web
            type=registry,ref=fr0der1c/tgtldr-web:buildcache,mode=max

      - *network-retry

      - name: Retry build and push image
        if: ${{ !cancelled() && steps.network_retry.outputs.retry == 'true' }}
        timeout-minutes: 20
        uses: docker/build-push-action@v6
        with: *web-build-inputs
